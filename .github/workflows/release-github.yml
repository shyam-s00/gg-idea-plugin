name: Release to GitHub

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  verify:
    name: Verify Plugin
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ide:
          - IC # IDEA Community
          - PC # PyCharm
          - RD # Rider
          - GO # GoLand
          - WS # WebStorm
          - PS # PhpStorm
          - RM # RubyMine

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Free up disk space on GitHub runner
        run: |
          echo "Freeing up disk space..."
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          sudo docker image prune --all --force
          sudo apt-get clean
          echo "Disk space after cleanup:"
          df -h

      - name: Setup Java 21
        uses: actions/setup-java@v6
        with:
          distribution: 'corretto'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Extract version
        id: extract_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Build and Verify Plugin (${{ matrix.ide }})
        env:
          ORG_GRADLE_PROJECT_pluginVerificationIde: ${{ matrix.ide }}
        run: ./gradlew verifyPlugin -PpluginVersion=${{ steps.extract_version.outputs.VERSION }} --no-daemon

  release:
    name: Upload Release Artifact
    needs: verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Java 21
        uses: actions/setup-java@v6
        with:
          distribution: 'corretto'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Extract version
        id: extract_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Build Plugin
        run: ./gradlew buildPlugin -PpluginVersion=${{ steps.extract_version.outputs.VERSION }} --no-daemon

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: build/distributions/*.zip

